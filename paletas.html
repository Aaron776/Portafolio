<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Comparar colores y tipografía — Aaron Ortiz</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font:14px/1.4 "Segoe UI",sans-serif;background:#f1f4f7;color:#182435;height:100dvh;display:flex;flex-direction:column}
    header{padding:14px 22px;background:white;border-bottom:1px solid #ccd4dd;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
    h1{font-size:15px;margin:0}p{margin:3px 0 0;font-size:12px;color:#566477}
    .options{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;cursor:pointer;background:white;border:1px solid #bac5d1;border-radius:6px;padding:10px 13px;display:flex;align-items:center;gap:8px;color:#182435}
    button[aria-pressed=true]{background:#182435;color:white;border-color:#182435}button:focus-visible,a:focus-visible{outline:3px solid #127f77;outline-offset:3px}
    .swatch{width:13px;height:13px;border-radius:50%;box-shadow:0 0 0 1px #80808080}
    .note{padding:8px 22px;margin:0;font-size:12px;display:flex;justify-content:space-between;gap:14px}a{color:#225e82}
    iframe{display:block;width:100%;flex:1;min-height:0;border:0;background:#101c2e}
    .type-options{display:flex;align-items:center;gap:12px;padding:10px 22px;background:#fff;border-bottom:1px solid #ccd4dd;flex-wrap:wrap}
    .type-options strong{font-size:12px}
    @media(max-width:650px){header{padding:10px 12px;gap:10px}.options{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:6px}button{font-size:12px;padding:9px}.note{padding:8px 12px;font-size:11px}}
  </style>
  <script src="js/paletas.js" defer></script>
</head>
<body>
  <header>
    <div><h1>Colores y tipografía</h1><p>Prueba combinaciones sobre tu página.</p></div>
    <div class="options" role="group" aria-label="Paleta de vista previa">
      <button data-palette="original" aria-pressed="true"><span class="swatch" style="background:#e2a063"></span>Original</button>
      <button data-palette="oceano" aria-pressed="false"><span class="swatch" style="background:#e9b66f"></span>Océano / arena · Nueva</button>
      <button data-palette="pizarra" aria-pressed="false"><span class="swatch" style="background:#b9c7fa"></span>Pizarra / lavanda · Nueva</button>
      <button data-palette="perla" aria-pressed="false"><span class="swatch" style="background:#285c9b"></span>Perla / zafiro · Nueva</button>
      <button data-palette="noche" aria-pressed="false"><span class="swatch" style="background:#57d9c0"></span>Azul noche / turquesa</button>
      <button data-palette="grafito" aria-pressed="false"><span class="swatch" style="background:#83b4ff"></span>Grafito / azul</button>
      <button data-palette="marfil" aria-pressed="false"><span class="swatch" style="background:#176b69"></span>Marfil / petróleo</button>
    </div>
  </header>
  <section class="type-options" aria-label="Comparar tipografías">
    <strong>Tipografía</strong>
    <div class="options" role="group" aria-label="Tipografía de vista previa">
      <button data-type="original" aria-pressed="true">Original</button>
      <button data-type="manrope" aria-pressed="false">Manrope + Source Sans 3</button>
      <button data-type="sora" aria-pressed="false">Sora + Source Sans 3</button>
      <button data-type="plex" aria-pressed="false">IBM Plex Sans</button>
    </div>
  </section>
  <div class="note"><span id="status" aria-live="polite">Cargando vista previa…</span><a href="index.html" target="_blank" rel="noopener">Abrir original</a></div>
  <iframe id="preview" title="Portafolio con la paleta seleccionada" src="index.html"></iframe>
</body>
</html>
